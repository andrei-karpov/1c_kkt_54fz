<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title description">
  <title id="title">Как ККТ-ОНЛАЙН работает с ТС ПИоТ и кассой</title>
  <desc id="description">ККТ-ОНЛАЙН версии 4.17 и выше отправляет код маркировки в ЕСМ по HTTPS на порт 51401 и получает ответ. ЕСМ обращается онлайн к ГИС МТ, а для офлайн-проверки к контроллеру локального модуля на порту 50063 и локальному модулю. ЕСМ обменивается данными с драйвером ККТ через порт драйвера 4042; драйвер связан с ККТ и фискальным накопителем. Отдельно обработка передаёт чек и команды ККТ через компоненту 1С в драйвер для фискализации и печати. Порты 4041 для АТОЛ и 50003 для Дримкас относятся к отдельным настройкам кассового ПО.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #173b39; }
      .title { font-size: 32px; font-weight: 650; }
      .subtitle { font-size: 22px; fill: #4b6563; }
      .box { fill: #f0fdfa; stroke: #75b8ae; stroke-width: 2; rx: 16; }
      .service { fill: #f8fbfa; stroke: #a3bfba; stroke-width: 2; rx: 16; }
      .heading { font-size: 28px; font-weight: 650; text-anchor: middle; }
      .body { font-size: 24px; text-anchor: middle; }
      .label { font-size: 23px; text-anchor: middle; }
      .note { font-size: 22px; fill: #49635f; }
      .flow { fill: none; stroke: #0f766e; stroke-width: 3; stroke-linejoin: round; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="825" fill="#ffffff"/>
  <text class="title" x="32" y="47">Как связаны обработка, ТС ПИоТ и касса</text>
  <text class="subtitle" x="32" y="83">Проверка марки и фискализация чека используют отдельные каналы.</text>

  <!-- Соединения рисуются до подписей и блоков. -->
  <path class="flow" d="M 324 190 H 448"/>
  <path class="flow" d="M 448 246 H 324"/>
  <path class="flow" d="M 740 204 H 876"/>
  <path class="flow" d="M 740 254 H 810 V 393 H 876"/>
  <path class="flow" d="M 1022 438 V 475"/>
  <path class="flow both" d="M 594 288 V 605"/>
  <path class="flow" d="M 178 288 V 605"/>
  <path class="flow" d="M 324 666 H 448"/>
  <path class="flow both" d="M 740 666 H 876"/>

  <rect class="box" x="32" y="166" width="292" height="122"/>
  <text class="heading" x="178" y="205">ККТ-ОНЛАЙН</text>
  <text class="body" x="178" y="240">версия 4.17 и выше</text>
  <text class="body" x="178" y="272">Обработка в 1С</text>

  <rect class="box" x="448" y="166" width="292" height="122"/>
  <text class="heading" x="594" y="205">ЕСМ / ТС ПИоТ</text>
  <text class="body" x="594" y="240">Проверка разрешения</text>
  <text class="body" x="594" y="272">на продажу</text>

  <rect class="service" x="876" y="166" width="292" height="122"/>
  <text class="heading" x="1022" y="205">ГИС МТ</text>
  <text class="body" x="1022" y="240">«Честный знак»</text>
  <text class="body" x="1022" y="272">Онлайн-проверка</text>

  <rect class="service" x="876" y="348" width="292" height="90"/>
  <text class="heading" x="1022" y="386">Контроллер ЛМ</text>
  <text class="body" x="1022" y="420">порт 50063</text>

  <rect class="service" x="876" y="475" width="292" height="80"/>
  <text class="body" x="1022" y="508" font-weight="650">Локальный модуль</text>
  <text class="body" x="1022" y="539">Офлайн-проверка</text>

  <rect class="box" x="32" y="605" width="292" height="122"/>
  <text class="heading" x="178" y="651">Компонента 1С</text>
  <text class="body" x="178" y="690">Печать и команды</text>

  <rect class="box" x="448" y="605" width="292" height="122"/>
  <text class="heading" x="594" y="651">ДККТ</text>
  <text class="body" x="594" y="690">Драйвер ККТ</text>

  <rect class="box" x="876" y="605" width="292" height="122"/>
  <text class="heading" x="1022" y="651">ККТ / ФН</text>
  <text class="body" x="1022" y="690">Фискализация чека</text>

  <text class="label" x="386" y="120">Проверка КМ</text>
  <text class="label" x="386" y="153">HTTPS :51401</text>
  <text class="label" x="386" y="319">Ответ ЕСМ</text>
  <text class="label" x="808" y="120">Онлайн</text>
  <rect x="751" y="312" width="118" height="35" fill="#fff"/>
  <text class="label" x="810" y="338">Офлайн</text>
  <rect x="50" y="409" width="256" height="74" rx="8" fill="#fff"/>
  <text class="label" x="178" y="438">Данные чека,</text>
  <text class="label" x="178" y="470">команды ККТ</text>
  <rect x="480" y="409" width="228" height="74" rx="8" fill="#fff"/>
  <text class="label" x="594" y="438">Связь с кассой</text>
  <text class="label" x="594" y="470">Порт драйвера :4042</text>

  <line x1="32" y1="759" x2="1168" y2="759" stroke="#d6e5e1" stroke-width="2"/>
  <text class="note" x="32" y="792">Порты 4041 (АТОЛ) и 50003 (Дримкас): отдельные настройки кассового ПО.</text>
</svg>
